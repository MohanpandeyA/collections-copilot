# Render Blueprint: backend as a Docker web service, frontend as a static site.
# The database is external (Neon), so DATABASE_URL is entered in the Render dashboard.
services:
  - type: web
    name: collections-copilot-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FIELD_ENC_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: MESSAGING_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: collections-copilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_API_URL
        sync: false
    routes:
      # Single page app: every path serves index.html so /officer and /manager reload correctly
      - type: rewrite
        source: /*
        destination: /index.html
